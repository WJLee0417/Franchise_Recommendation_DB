name: P0 CSV ingestion tests
on:
  pull_request:
    paths:
      - 'src/franchise_dw/**'
      - 'tests/test_p0_csv_ingest.py'
      - '.github/workflows/p0-csv-ingest.yml'
  push:
    branches: [main, feature/phase3-data-source-spec]
    paths:
      - 'src/franchise_dw/**'
      - 'tests/test_p0_csv_ingest.py'
      - '.github/workflows/p0-csv-ingest.yml'
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic CSV/ZIP unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_p0_csv_ingest.py' -v
