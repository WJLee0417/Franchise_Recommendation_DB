name: P0 quality transformation tests
on:
  pull_request:
    paths:
      - 'src/franchise_dw/transform_p0_quality.py'
      - 'tests/test_p0_quality_transform.py'
      - '.github/workflows/p0-quality-transform.yml'
      - 'sql/v2/migrations/005_p0_quality_staging.sql'
  push:
    branches: [main, feature/phase3-4-p0-quality-profile]
    paths:
      - 'src/franchise_dw/transform_p0_quality.py'
      - 'tests/test_p0_quality_transform.py'
      - '.github/workflows/p0-quality-transform.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute quality classification unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_p0_quality_transform.py' -v
  schema:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest_root_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: MySQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y default-mysql-client
      - name: Create 49 existing tables then quality staging objects
        env:
          MYSQL_PWD: test_root_only
        run: |
          mysql -h 127.0.0.1 -uroot < sql/v2/p0/001_schema.sql
          mysql -h 127.0.0.1 -uroot < sql/v2/migrations/004_store_rate_nonnegative.sql
          mysql -h 127.0.0.1 -uroot < sql/v2/p1/002_schema.sql
          mysql -h 127.0.0.1 -uroot < sql/v2/p2/003_schema.sql
          mysql -h 127.0.0.1 -uroot < sql/v2/migrations/005_p0_quality_staging.sql
          test "$(mysql -h 127.0.0.1 -uroot -N -B -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='franchise_dw_p0' AND table_type='BASE TABLE'")" = "51"
