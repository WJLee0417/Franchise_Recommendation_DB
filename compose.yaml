services:
  mysql:
    image: mysql:8.4
    container_name: franchise-demo-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-demo-root}
      MYSQL_DATABASE: ${FRANCHISE_DB_NAME:-franchise_demo}
      MYSQL_USER: ${FRANCHISE_DB_USER:-franchise}
      MYSQL_PASSWORD: ${FRANCHISE_DB_PASSWORD:-franchise}
    ports:
      - "${FRANCHISE_DB_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - franchise_mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed_demo.sql:/docker-entrypoint-initdb.d/02-seed-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  franchise_mysql_data:
